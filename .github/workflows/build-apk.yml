name: Build Android APK

on:
  workflow_dispatch: # Allows you to trigger the build manually with one click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleNormalDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-custom-layout-apk
          path: android/app/build/outputs/apk/normal/debug/*.apk
