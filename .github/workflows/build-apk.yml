name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Locate and Build APK
        run: |
          # Find gradlew whether it is in root or android/
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleNormalDebug
          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleNormalDebug
          else
            # If gradlew wrapper is missing, use system gradle to build android project
            sudo apt-get install -y gradle
            cd android
            gradle assembleNormalDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-custom-layout-apk
          path: |
            **/build/outputs/apk/**/*.apk
